<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smith 3D preview</title>
  <style>
    html, body, #preview { height:100%; }
    body { margin:0;font:14px system-ui; }
    p { padding:1rem; }
    #preview > .smith-viewer { display:flex;flex-direction:column;height:100%;box-sizing:border-box; }
    #preview > .smith-preview canvas,
    #preview > .smith-drawing img { flex:1;min-height:0;height:0;max-height:none;object-fit:contain; }
  </style>
</head>
<body>
  <div id="preview"><p role="status">Loading 3D preview…</p></div>
  <noscript><p>Enable JavaScript to inspect this model in 3D.</p></noscript>
  <script type="module" src="viewer.js"></script>
</body>
</html>
